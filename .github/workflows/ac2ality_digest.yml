name: Ac2ality News Digest

# Genera digest.json y publica la versión iPhone/web en GitHub Pages.
# Horas en UTC: 05:30, 08:30, 11:30, 14:30 y 17:30 (≈ 06:30–18:30 Madrid en invierno).
on:
  schedule:
    - cron: '30 5-17/3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  update-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Buscar noticias
        if: github.event_name != 'push'
        run: python fetch_digest.py

      - name: Commit y push de digest.json
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digest.json
          git diff --staged --quiet || git commit -m "digest: actualización automática $(date -u +%Y-%m-%d\ %H:%M)"
          git pull --rebase origin main && git push

      - name: Preparar sitio (interfaz + digest)
        run: |
          mkdir -p _site
          cp -r web/* _site/
          cp digest.json _site/digest.json
          touch _site/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update-digest
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
